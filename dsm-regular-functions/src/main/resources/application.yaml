langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.5-flash
      reasoning-effort: none  # 禁用推理
      log-responses: true
      log-requests: true
    # 流式输出
    streaming-chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.5-flash
      reasoning-effort: none  # 禁用推理
      log-requests: true    # 日志
      log-responses: true   # 日志
    # 向量模型
    embedding-model:
      api-key: ${AI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: text-embedding-v4
logging:
  level:
    dev.langchain4j: debug

spring:
  application:
    name: music
  #数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:music}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      enabled: true
      max-file-size: 5GB
      max-request-size: 5GB
      file-size-threshold: 5GB
redisson:
    # 关闭 Redisson 对 Spring Data Redis 的自动整合
  spring-data-redis:
    enabled: false
    # 单独配置 Redisson 的 Redis 连接（和上面的 Spring Redis 可以用同一个 Redis 实例，只是连接池独立）
  singleServerConfig:
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
server:
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1
    connection-timeout: 120000
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    type-aliases-package: com.example.music.entity.pojo
    mapper-locations: classpath:mapper/*.xml
---
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  proxy-host: ${MINIO_PROXY_HOST:http://localhost:9000/minio} # 用于返回给前端的地址
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:file}


spring:
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:guest}
    password: ${MQ_PASSWORD:guest}
    virtual-host: ${MQ_VHOST:/}
    listener:
      simple:
       prefetch: 1
       acknowledge-mode: auto # 消费者确认机制
       retry:
         enabled: true  # 开启消费者失败重试
         initial-interval: 1000ms # 初始的失败等待时长为1秒
         max-attempts: 3 # 最大失败重试次数
         stateless: true # true无状态 false有状态。如果业务中包含事务，这里改为false

    # 生产者重连配置
    connection-timeout: 200ms # 连接超时时间
    template:
      retry:
        enabled: true # 开启超时重试机制
        initial-interval: 1000ms # 失败后的重连间隔时间
        max-attempts: 3 # 最大重试次数
        multiplier: 1 # 重试间隔时间 multiplier 倍增长
    #生成者确认机制
    # 开启RabbitMQ的发布者确认（Publisher Confirm）机制。
    # 该机制确保生产者发送的消息已成功被RabbitMQ交换机接收。
    publisher-confirm-type: correlated # 开启确认模式
    publisher-returns: true # 开启返回模式

# JWT 签名密钥（Base64 编码，HS256 至少 32 字节）
# 不配置时启动会随机生成一个，重启后已签发的 token 全部失效
jwt:
  secret: ${JWT_SECRET:}
